schema_version: 1

context:
  version: "0.3.1"
  python_min: "3.12"

package:
  name: tau-ai
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/tau-ai/tau_ai-${{ version }}.tar.gz
    sha256: fb4f7a6a6548efcb9b269ac6ca5bee56e3f5649d668b4ed0deb7b4b19e23fe42

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling >=1.26
  run:
    - python >=${{ python_min }}
    - anyio >=4.0.0
    - httpx >=0.27
    - socksio >=1.0.0,<2.0.0
    - packaging >=24.0
    - pydantic >=2.0
    - pygments >=2.18
    - rich >=13.0
    - textual >=8.2.8
    - typer >=0.12

tests:
  - python:
      imports: tau_agent
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  homepage: https://twotimespi.dev
  repository: https://github.com/huggingface/tau
  summary: A Python implementation of a minimalist Pi-style coding-agent harness.

extra:
  recipe-maintainers:
    - davidbrochart
